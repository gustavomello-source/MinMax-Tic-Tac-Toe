# ============================================================
# Project Metadata (PEP 621)
# ============================================================

[project]
name = "tictactoe"
version = "0.1.0"
description = "A simple Tic Tac Toe game implemented with Python."
readme = "README.md"

requires-python = ">=3.12"

license = { text = "MIT" }

authors = [{ name = "Gustavo Mello", email = "azureeau@gmail.com" }]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = ["pygame>=2.6,<3"]


# ============================================================
# Optional dependency groups
#
# Install using:
#
# pip install -e ".[dev]"
#
# ============================================================

[project.optional-dependencies]

dev = ["ruff>=0.12", "pytest>=8.4.2", "pytest-cov>=7.0"]

# ============================================================
# Build System
#
# Leave this alone unless publishing the package.
# ============================================================

[build-system]

requires = ["setuptools>=80", "wheel"]

build-backend = "setuptools.build_meta"


# ============================================================
# Ruff
# ============================================================

[tool.ruff]

target-version = "py312"

line-length = 88

indent-width = 4


# ============================================================
# Ruff Formatter
# ============================================================

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

line-ending = "lf"

skip-magic-trailing-comma = false

docstring-code-format = true


# ============================================================
# Ruff Linter
# ============================================================

[tool.ruff.lint]

select = [

    # pycodestyle
    "E",

    # pyflakes
    "F",

    # import sorting (isort)
    "I",

    # pyupgrade
    "UP",

    # bugbear
    "B",

    # simplify
    "SIM",

    # comprehensions
    "C4",

    # naming
    "N",

    # unused arguments
    "ARG",

    # pathlib
    "PTH",

    # return statements
    "RET",

    # unnecessary code
    "RUF",

]

ignore = [

    # Allow long URLs inside docstrings/comments
    "E501",

    # Allow X/y naming convention for ML features/targets
    "N803",
    "N806",

]


# ============================================================
# Per-file ignores
# ============================================================

[tool.ruff.lint.per-file-ignores]

"__init__.py" = ["F401"]

"tests/*" = ["S101"]


# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]

testpaths = ["tests"]

python_files = ["test_*.py"]

python_classes = ["Test*"]

python_functions = ["test_*"]

addopts = ["--strict-markers", "--strict-config", "-ra"]
